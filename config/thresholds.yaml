# Decision thresholds for matching and path reconstruction.
#
# This file is the ONLY source of these values. The Python model
# (multicam_tracker.config.ThresholdSettings) declares every field as required
# with no default, so a threshold that is added to the model but forgotten here
# fails at startup rather than silently falling back to a magic number.
#
# Values below are the defaults from the global contract's confidence_model.
# Any single value can be overridden per-environment without editing this file:
#   MCT_THRESHOLDS__PLATE_FUZZY_MAX_EDIT_DISTANCE=1
#
# Stage 06 (plate matching) and stage 07 (embedding re-id) calibrate these
# against the synthetic ground-truth datasets from stage 05. Treat the numbers
# here as starting points, not as measured optima.

# Minimum OCR confidence for a plate match to be auto-accepted without human
# review. Below this, the match goes to the review queue (stage 18).
plate_auto_accept_min_confidence: 0.85

# Maximum Levenshtein distance, computed on the ambiguity-folded plate forms,
# for two plates to be considered a fuzzy match. Tolerates the common OCR
# confusions (0/O, 1/I, 8/B) without collapsing genuinely different plates.
plate_fuzzy_max_edit_distance: 2

# Maximum CONFUSION-WEIGHTED distance for a fuzzy match.
#
# MEASURED, not guessed. The sweep in docs/PLATE_MATCHING.md shows a cliff at
# exactly 1.0: precision on the 'realistic' scenario is 1.000 at 0.9 and below,
# and 0.625 at 1.0 and above. The reason is structural rather than lucky -- an
# in-group substitution (0 read as O) costs 0.5 while an arbitrary one costs
# 1.0, so a cutoff just under 1.0 admits every genuine OCR confusion and
# rejects every near-miss decoy that differs by an unrelated character.
#
# Re-run scripts/evaluate_matching.py --sweep before changing this.
plate_fuzzy_max_weighted_distance: 0.9

# Length difference beyond which two readings cannot be the same plate,
# whatever their edit distance. A 4-character read and a 7-character plate are
# not the same vehicle.
plate_max_length_delta: 2

# Cost of substituting a character for one it is genuinely confusable with. A
# 0 read as O is far more likely than a 0 read as W, and charging both the same
# would force a choice between admitting the W case and rejecting the O case.
plate_confusion_substitution_cost: 0.5

# Base weights by match method. Exact reads carry more evidence than fuzzy ones
# even at identical OCR confidence.
plate_exact_method_weight: 1.0
plate_fuzzy_method_weight: 0.9

# Score lost per unit of weighted edit distance.
plate_distance_penalty_per_unit: 0.12

# Below this score a candidate is discarded outright rather than queued. The
# band between here and plate_auto_accept_min_confidence is the human review
# zone (stage 18).
#
# MEASURED: 0.5 holds recall at 1.000 on 'realistic'; 0.6 drops it to 0.600
# while buying no precision, because every candidate it removes was already
# correct. See the sweep table in docs/PLATE_MATCHING.md.
plate_review_min_confidence: 0.5

# Cosine similarity at or above which a re-id embedding match is auto-accepted
# without a human.
#
# MEASURED, not guessed. On the 'hard_negatives' scenario -- decoys drawn
# deliberately close to the target -- 0.92 auto-accepts 21 decoys while 0.95
# auto-accepts ZERO, at no cost to recall (1.000 either way) and no loss of
# plate-failure recovery. The sweep is in docs/REID_MATCHING.md.
#
# The contract's 0.92 was a reasonable prior; the measurement says otherwise,
# and hard negatives are exactly the case a prior cannot anticipate.
embedding_auto_accept_min_similarity: 0.95

# Cosine similarity at or above which a re-id embedding match is worth showing
# to a human. Below this the candidate is discarded outright. The band between
# this and embedding_auto_accept_min_similarity is the review zone.
embedding_review_min_similarity: 0.75

# Minimum gap between the best and second-best embedding candidate before the
# best may be auto-accepted. Two near-identical vehicles must never be resolved
# without a human, however high the absolute score -- a confident choice between
# two indistinguishable options is a coin flip wearing a number.
embedding_margin_min: 0.04

# Ceiling on a visual-only match score. Deliberately below
# plate_review_min_confidence x plate_exact_method_weight so an embedding match
# can never outrank any valid plate match. Re-id is weaker evidence: many
# vehicles share a make, model, and colour.
embedding_only_score_ceiling: 0.45

# Added when plate and embedding agree, bounded at 1.0.
embedding_agreement_boost: 0.05

# Below this similarity, an embedding actively contradicts a strong plate match
# rather than merely failing to corroborate it. The pair is flagged conflicting
# and forced to human review.
embedding_disagreement_similarity: 0.4

# Reference embeddings retained per target after pruning.
embedding_max_references: 8

# --- Path reconstruction (stage 08) ----------------------------------------

# Score added for each sighting the optimal path includes.
#
# MEASURED, and the measurement contradicted the prior. The contract expected a
# positive bonus to stop the engine returning short confident fragments. The
# sweep in docs/PATH_RECONSTRUCTION.md shows it is unnecessary and actively
# harmful:
#
#   * Unnecessary, because hop weights are multiplicative. A well-supported hop
#     contributes roughly 0.8, so extending a route is already worth far more
#     than stopping. Clean, realistic, and sparse_coverage all reconstruct their
#     full routes exactly at a bonus of zero.
#   * Harmful, because a per-node bonus is a fixed payment for including a node
#     whatever the evidence behind it. At 0.05 the engine chains decoy sightings
#     into the adversarial route and stops flagging it ambiguous -- it becomes
#     confidently wrong, which is the one outcome the whole design exists to
#     avoid.
#
# Left configurable rather than removed: a deployment whose matcher produces
# systematically weaker scores may need it, and it should be swept there too.
path_node_inclusion_bonus: 0.0

# Score removed from a hop that has to cross unmonitored ground -- no direct
# link, and no indirect route that fits the time available.
#
# MEASURED. The scale is set by the topology's unlinked plausibility floor
# (0.1): a gap hop between two confident matches is worth 0.9 x 0.9 x 0.1 =
# 0.081 before the penalty, so the penalty is what decides whether such a hop
# can ever be taken.
#
#   * 0.05 leaves it at +0.031 -- a strongly supported vehicle still bridges an
#     unmonitored district, which is what skip edges exist for.
#   * The same penalty makes a weak pair (0.45 x 0.45 x 0.1 = 0.020) negative,
#     so a route does not reach across unmonitored ground to collect a
#     candidate that appearance alone put forward.
#   * Raising it to 0.50 buys ~4 points of precision on adversarial data and
#     costs the skip-edge behaviour entirely. The sweep table records both.
path_gap_edge_penalty: 0.05

# Normalized score margin below which the best and second-best paths are treated
# as indistinguishable, and the alternatives are surfaced instead of one answer.
# Presenting a coin flip as a certainty is the failure mode this exists to
# prevent.
path_ambiguity_margin_min: 0.05

# How far a trajectory's overall confidence may exceed its weakest hop.
#
# A chain is not stronger than its weakest link. The geometric mean alone would
# report 0.46 for a route containing a 0.10 hop, which reads as "moderate" when
# one link is barely evidence at all. The aggregate is therefore capped at the
# weakest hop plus this allowance -- the allowance exists because corroborating
# strong hops do carry some information, not none.
path_weakest_link_tolerance: 0.05

# --- Vehicle detection and tracking (stage 11) -----------------------------
#
# NOT MEASURED. Unlike the matching and pathing numbers above, these have not
# been swept against ground truth, because the only detector available in this
# environment is a synthetic one and sweeping against it would calibrate the
# fixture rather than the system. They are documented starting points with a
# stated reason each, and stage 13 or 20 must re-derive them against a real
# detector on real footage. Do not cite them as measured.

# Smallest box that is plausibly a vehicle, in source-frame pixels. Below this
# a detection is a speck: a distant pedestrian, a bird, a compression artifact.
# 400 px is a 20x20 box, at which no plate is readable and no re-id embedding
# is worth extracting, so nothing downstream could use it anyway.
detection_min_bbox_area_px: 400

# Largest box that is plausibly one vehicle, as a fraction of the frame. A
# detection covering most of the frame is a failed detection -- a lens flare, a
# lorry side filling the view, or a model that has latched onto the background.
detection_max_bbox_area_fraction: 0.5

# Width-to-height bounds. A car viewed from the side is about 2.5:1 and from
# the front about 1.2:1; a motorcycle from behind is about 0.5:1. The window is
# wider than any of those because a box clipped by the frame edge is legitimately
# elongated, and rejecting those would discard exactly the vehicles entering and
# leaving view.
detection_min_aspect_ratio: 0.25
detection_max_aspect_ratio: 5.0

# In overlap mode, the fraction of a box that must lie inside the region of
# interest. Half, so a vehicle straddling the region boundary is attributed to
# the region it is mostly in rather than dropped by both.
detection_roi_min_overlap: 0.5

# Minimum IoU between a predicted track box and a detection for the two to be
# associated. 0.3 is the SORT default and the reasoning carries: at typical
# urban speeds and a 5 fps sampling cadence a vehicle moves a fraction of its
# own length between frames, so a genuine continuation overlaps heavily, while
# 0.3 is still low enough to survive a detector that wobbles by a few pixels.
track_association_min_iou: 0.3

# Consecutive updates a track may go unmatched before it is terminated. This is
# the occlusion allowance: a vehicle passing behind a pole disappears for a
# handful of frames and must come back with the same identity. Counted in
# tracker updates rather than source frame indices, because the tracker is fed
# sampled frames and the gap that matters is the gap in what it saw.
#
# Too high and two different vehicles get stitched into one track, which is the
# confident-wrong-answer failure in miniature. Five is about a second at the
# configured 5 fps cadence.
track_max_age_frames: 5

# Detections a track needs before it is confirmed and may emit a sighting. Two
# would admit a pair of consecutive false positives; three requires a detector
# to be wrong in the same place three times running.
track_min_hits_to_confirm: 3

# Best-frame ranking weights. Each criterion scores in [0, 1] and the four sum
# to 1.0, which is enforced at startup -- any other sum puts the composite score
# outside [0, 1] and makes it unreadable in a review UI.
#
# The ordering is the claim: what most determines whether a plate can be read is
# that the image is sharp and that the detector was sure it was looking at a
# vehicle. Size matters less than it looks, because a vehicle leaving the frame
# is large and useless. Centrality is a weak proxy for "not about to be cut off"
# and is weighted accordingly.
best_frame_confidence_weight: 0.35
best_frame_sharpness_weight: 0.30
best_frame_area_weight: 0.20
best_frame_centrality_weight: 0.15

# Fraction of the composite score removed when the box touches the frame edge.
# Half, which is deliberately brutal: a vehicle cut off by the frame is missing
# part of the very thing the frame would be selected for.
#
# Applied as a discount rather than a subtraction so that a track seen only at
# the frame edge still ranks its own frames meaningfully instead of collapsing
# them all onto a floor of zero.
best_frame_edge_penalty: 0.5

# Multiplier applied to a hop's confidence when the elapsed time between two
# sightings falls outside the CameraLink travel-time window. The hop is
# penalised, not discarded: an implausible transit may still be real (a detour,
# a stop) and the confidence score is what surfaces the doubt to the operator.
hop_implausible_penalty: 0.5
