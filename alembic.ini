; Alembic configuration.
;
; The database URL is deliberately absent: migrations/env.py reads it from
; Settings, so a migration always targets the same database the application
; does. A URL here would be a second source of truth and a place to accidentally
; commit a credential.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

; Migration files are named 0001_initial_schema.py and so on: a zero-padded
; ordinal reads in dependency order in a directory listing, which a bare
; revision hash does not.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
