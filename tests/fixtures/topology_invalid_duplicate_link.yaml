# Failure mode: the same ordered pair declared twice.
cameras:
  - camera_id: cam_a
    name: Alpha
    lat: 0.0
    lon: 0.0
  - camera_id: cam_b
    name: Bravo
    lat: 0.0
    lon: 0.01
links:
  - from_camera_id: cam_a
    to_camera_id: cam_b
    min_travel_time_sec: 10.0
    max_travel_time_sec: 20.0
    bidirectional: false
  - from_camera_id: cam_a
    to_camera_id: cam_b
    min_travel_time_sec: 30.0
    max_travel_time_sec: 60.0
    bidirectional: false
