name: hard_negatives
description: "Decoys drawn close to the target in embedding space: other vehicles of the same make, model, and colour."
topology_file: config/topology.yaml
seed: 4004
jitter_sec: 5.0
ingest_delay_sec: 1.0
vehicles:
  - vehicle_id: target
    plate: ABC1234
    route: [cam_01, cam_02, cam_03, cam_04, cam_05]
    departure_utc: '2026-08-10T14:00:00.000Z'
    object_class: car
    speed_profile: 0.45
    is_target: true
noise:
  corruption_probability: 0.6
  read_failure_weight: 5.0
embeddings:
  dimension: 512
  intra_class_sigma: 0.25
  hard_negative_fraction: 0.6
  hard_negative_sigma: 0.15
traffic:
  decoy_vehicles: 20
  decoy_route_length: 3
adversarial: {}
