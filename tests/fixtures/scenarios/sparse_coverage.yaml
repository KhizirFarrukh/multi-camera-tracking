name: sparse_coverage
description: "The target crosses uncovered ground, so consecutive sightings are two hops apart and single-hop reasoning misses the link."
topology_file: config/topology.yaml
seed: 5005
jitter_sec: 6.0
ingest_delay_sec: 1.0
vehicles:
  - vehicle_id: target
    plate: ABC1234
    route: [cam_01, cam_03, cam_05]
    departure_utc: '2026-08-10T14:00:00.000Z'
    object_class: car
    speed_profile: 0.45
    is_target: true
noise:
  corruption_probability: 0.3
embeddings:
  dimension: 512
  intra_class_sigma: 0.25
traffic:
  decoy_vehicles: 12
  decoy_route_length: 2
adversarial: {}
