[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project
# ---------------------------------------------------------------------------
[project]
name = "multicam-tracker"
version = "0.1.0"
description = "Multi-camera object tracking and path reconstruction from license plates and visual re-identification."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khizir Farrukh" }]
keywords = ["computer-vision", "re-identification", "anpr", "multi-camera", "tracking"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Core: everything the logic-only stages (01-09) and the API need. Deliberately
# free of any CV dependency so CI installs in seconds and logic stages are not
# blocked on a torch build.
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pyyaml>=6.0,<7",
  "structlog>=24.1,<26",
  # Vector maths for re-id similarity (stage 07). Core rather than a vision
  # extra because the matching path is not optional, and numpy carries no CV
  # or model-weight dependency of its own.
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Vision: heavy, platform-sensitive, and not needed until stage 11. Kept as an
# extra so `uv sync` and CI stay light. PaddleOCR in particular is the most
# install-fragile dependency in the stack -- isolating it here means a failed
# paddle build cannot block work on any other stage.
vision = [
  "opencv-python>=4.10,<5",
  # PyAV is the fallback decoder (stage 10): it reads exact rational frame
  # rates and per-frame presentation timestamps, which OpenCV does not expose
  # and which a variable-rate recording needs to be placed in time at all.
  "av>=12,<16",
  "ultralytics>=8.3,<9",
  "paddlepaddle>=2.6,<4",
  "paddleocr>=2.8,<4",
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "pillow>=10.3,<12",
]

dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<8",
  "pytest-mock>=3.14,<4",
  "hypothesis>=6.100,<7",
  "freezegun>=1.5,<2",
  "testcontainers[postgres]>=4.5,<5",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-pyyaml>=6.0,<7",
]

[project.urls]
Documentation = "docs/ARCHITECTURE.md"

[tool.hatch.build.targets.wheel]
packages = ["src/multicam_tracker"]

# ---------------------------------------------------------------------------
# Ruff -- lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "weights", "storage", "data"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort -- import ordering
  "N",   # pep8-naming
  "UP",  # pyupgrade -- keep syntax current with the declared floor
  "B",   # flake8-bugbear -- mutable defaults, loop-variable capture
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["multicam_tracker"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file; long parametrize tables are fine.
"tests/**/*.py" = ["E501"]
# UP042 wants enum.StrEnum. Stage 02 task 2.1 specifies `(str, Enum)` verbatim,
# and both satisfy its stated purpose (members serialize as plain strings), so
# the spec's mechanism wins. Delete this line and switch the base class if the
# project later prefers StrEnum -- the only behavioural difference is that
# str(member) yields "ObjectClass.CAR" here versus "car" under StrEnum.
"src/multicam_tracker/models/enums.py" = ["UP042"]
# The normalization tests feed deliberate homoglyphs (Cyrillic A, Greek zeta)
# to prove they are rejected rather than silently accepted. Flagging them as
# ambiguous is exactly right in prose and exactly wrong in this fixture.
"tests/unit/matching/test_normalize.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy -- strict on the package, relaxed only where third-party stubs are absent
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/multicam_tracker"]
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The CV stack ships no type information. Silencing the import error is not the
# same as silencing type checking of our own code that calls it -- calls into
# these modules are typed as Any and must be wrapped at our boundary.
module = [
  "cv2.*",
  "ultralytics.*",
  "paddle.*",
  "paddleocr.*",
  "torch.*",
  "torchvision.*",
  "pgvector.*",
  "testcontainers.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." puts the repo root on sys.path so shared builders under tests/fixtures/
# are importable as `tests.fixtures.factories` from any stage's test module.
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=multicam_tracker",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
]
markers = [
  "unit: fast, no network, no database, no model weights",
  "integration: may use a real database, sample media, or real model weights",
  "slow: takes more than a few seconds",
  "requires_gpu: needs a CUDA device",
  "requires_models: needs downloaded model weights (vision extra)",
]
filterwarnings = [
  "error",
  # testcontainers/docker emit these on teardown; not ours to fix.
  "ignore::DeprecationWarning:docker.*",
  "ignore::ResourceWarning",
]

# ---------------------------------------------------------------------------
# Coverage -- the 85% gate from the global contract's testing_standards
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "class .*\\(Protocol\\):",
  "\\.\\.\\.",
]
